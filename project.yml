name: José
options:
  bundleIdPrefix: com.ericyangchen
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.ericyangchen.jose
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.5"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    OTHER_SWIFT_FLAGS: ""

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0

targets:
  José:
    type: application
    platform: macOS
    sources:
      - path: Sources/José
        excludes:
          - "Audio/VAD/convert_silero.py"
          - "Audio/VAD/README.md"
          - "Audio/VAD/.venv/**"
          - "Audio/VAD/.work/**"
          - "**/*.pyc"
          - "**/__pycache__/**"
      - path: Resources/DefaultPrompt.md
        type: file
      - path: Resources/DefaultVocabulary.yaml
        type: file
      - path: Resources/Assets.xcassets
    resources: []
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: José
        CFBundleDisplayName: José
        CFBundleIdentifier: com.ericyangchen.jose
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        NSMicrophoneUsageDescription: "José needs microphone access to capture your voice for transcription."
        NSAppleEventsUsageDescription: "José uses Apple Events to paste transcriptions into the focused application."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: Resources/José.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Eric Chen. All rights reserved."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      runOptions:
        environmentVariables:
          OS_ACTIVITY_MODE: ""
